name: Aggregation Core Prototype

on:
  push:
    branches:
      - main
      - prototype/universal-search-core
    paths:
      - "prototype/aggregation-core/**"
      - ".github/workflows/aggregation-core.yml"
  pull_request:
    paths:
      - "prototype/aggregation-core/**"
      - ".github/workflows/aggregation-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run aggregation tests
        working-directory: prototype/aggregation-core
        run: npm test
