name: Kotlin Aggregation Core

on:
  push:
    paths:
      - "prototype/kotlin-aggregation-core/**"
      - ".github/workflows/kotlin-aggregation-core.yml"
  pull_request:
    paths:
      - "prototype/kotlin-aggregation-core/**"
      - ".github/workflows/kotlin-aggregation-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - name: Run Kotlin tests
        working-directory: prototype/kotlin-aggregation-core
        run: gradle test --no-daemon
