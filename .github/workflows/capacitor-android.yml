name: Capacitor Android Build

on:
  push:
    branches: [main]
    paths:
      - "capacitor-app/**"
      - ".github/workflows/capacitor-android.yml"
  pull_request:
    paths:
      - "capacitor-app/**"
      - ".github/workflows/capacitor-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-capacitor-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capacitor-app
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Test aggregation and provider orchestration
        run: npm test

      - name: Build production web app
        run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Integrate local Media3 native player
        run: node scripts/integrate-native-player.mjs

      - name: Build debug APK
        working-directory: capacitor-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Capacitor debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 7xCinema-Capacitor-Debug
          path: capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
