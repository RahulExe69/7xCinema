name: Capacitor Android Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "feat/moviebox-tui-providers"]
    paths:
      - "capacitor-app/**"
      - ".github/workflows/capacitor-android.yml"
  pull_request:
    paths:
      - "capacitor-app/**"
      - ".github/workflows/capacitor-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-capacitor-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capacitor-app
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check out MovieBox-TUI provider engine
        uses: actions/checkout@v4
        with:
          repository: RahulExe69/Moviebox-Tui
          ref: 2cc3390cd526d36e5864f15ba5243dc3dde46e4e
          path: moviebox-tui-engine

      - name: Set up Rust for Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: aarch64-linux-android

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: false

      - name: Configure Android Rust linker
        shell: bash
        env:
          NDK_PATH: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/aarch64-linux-android21-clang"
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"

      - name: Build bundled MovieBox-TUI ARM64 engine
        working-directory: moviebox-tui-engine
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
        run: cargo build --locked --release --target aarch64-linux-android --lib


      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Test aggregation and provider orchestration
        run: npm test

      - name: Build production web app
        run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Bundle MovieBox-TUI native library into the APK
        shell: bash
        run: |
          set -euo pipefail
          JNI_LIBS="android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI_LIBS"
          install -m 0644 ../moviebox-tui-engine/target/aarch64-linux-android/release/libmoviebox_tui.so "$JNI_LIBS/libmoviebox_tui.so"

      - name: Integrate local Media3 native player
        run: node scripts/integrate-native-player.mjs

      - name: Build debug APK
        working-directory: capacitor-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Capacitor debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 7xCinema-Capacitor-Debug
          path: capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
